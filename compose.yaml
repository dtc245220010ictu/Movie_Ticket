# ========================================================
# DOCKER COMPOSE — HỆ THỐNG ĐẶT VÉ XEM PHIM (ĐỀ 11)
# GIAI ĐOẠN 5: LOKI & PROMTAIL HỆ THỐNG LOG TẬP TRUNG
# ========================================================

name: movie-ticket

services:
  # ------------------------------------------------------
  # 1. Cơ sở dữ liệu MySQL 8.x
  # ------------------------------------------------------
  db:
    image: mysql:8.0.40
    container_name: movieticket_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootAdminSuperSecure2026!}
      MYSQL_DATABASE: ${DB_NAME:-cinema_booking}
      MYSQL_USER: ${DB_USER:-cinema_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CinemaSecurePass2026!}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
      - dbadmin
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # ------------------------------------------------------
  # 2. Ứng dụng Backend Web & API (Node.js / Express)
  # ------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: movieticket-app:1.0.0
    container_name: movieticket_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cinema_booking}
      DB_USER: ${DB_USER:-cinema_user}
      DB_PASSWORD: ${DB_PASSWORD:-CinemaSecurePass2026!}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # ------------------------------------------------------
  # 3. Nginx Reverse Proxy & HTTPS Cổng Truy Cập Duy Nhất
  # ------------------------------------------------------
  nginx:
    image: nginx:1.27.3-alpine
    container_name: movieticket_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/nginx_health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------
  # 4. Quản trị Database trực quan (phpMyAdmin)
  # ------------------------------------------------------
  pma:
    image: phpmyadmin:5.2.1
    container_name: movieticket_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-cinema_user}
      PMA_PASSWORD: ${DB_PASSWORD:-CinemaSecurePass2026!}
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PMA_PORT_HOST:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbadmin

  # ------------------------------------------------------
  # 5. MySQL Prometheus Exporter (Giám sát Database)
  # ------------------------------------------------------
  mysql_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: movieticket_mysql_exporter
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-ExporterSecurePass2026!}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - monitoring

  # ------------------------------------------------------
  # 6. Nginx Prometheus Exporter (Giám sát Web Server)
  # ------------------------------------------------------
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: movieticket_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx/stub_status
    depends_on:
      - nginx
    networks:
      - frontend
      - monitoring

  # ------------------------------------------------------
  # 7. cAdvisor (Giám sát hiệu năng phần cứng Container)
  # ------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: movieticket_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8082}:8080"
    networks:
      - monitoring

  # ------------------------------------------------------
  # 8. Prometheus Server (Thu thập và lưu trữ Metrics)
  # ------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: movieticket_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
      - nginx_exporter
      - mysql_exporter
    networks:
      - frontend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------
  # 9. Grafana (Trực quan hóa Dashboard Giám sát & Logs)
  # ------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: movieticket_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaSecret2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------
  # 10. Grafana Loki (Hệ thống Lưu trữ Log tập trung)
  # ------------------------------------------------------
  loki:
    image: grafana/loki:3.2.1
    container_name: movieticket_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki:/etc/loki:ro
      - loki_data:/loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ------------------------------------------------------
  # 11. Promtail (Thu thập Log Container chuyển về Loki)
  # ------------------------------------------------------
  promtail:
    image: grafana/promtail:3.2.1
    container_name: movieticket_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - monitoring

# ========================================================
# CÁCH LY MẠNG (NETWORK ISOLATION)
# ========================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  dbadmin:
    driver: bridge
  monitoring:
    driver: bridge

# ========================================================
# LƯU TRỮ BỀN VỮNG (PERSISTENT VOLUMES)
# ========================================================
volumes:
  db_data:
    name: movieticket_db_data
  prometheus_data:
    name: movieticket_prometheus_data
  grafana_data:
    name: movieticket_grafana_data
  loki_data:
    name: movieticket_loki_data
