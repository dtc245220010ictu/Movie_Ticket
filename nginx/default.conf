# ========================================================
# CẤU HÌNH NGINX REVERSE PROXY & HTTPS (ĐỀ 11)
# ========================================================

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Ẩn phiên bản Nginx để tăng cường bảo mật
    server_tokens off;

    # Redirect 301 chuyển hướng toàn bộ traffic sang HTTPS cổng 8443
    location / {
        return 301 https://$host:8443$request_uri;
    }

    # Endpoint phục vụ kiểm tra nội bộ qua HTTP nếu cần
    location /nginx_health {
        access_log off;
        return 200 "healthy\n";
    }
}

# 2. Cổng bảo mật HTTPS (Port 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost 127.0.0.1;

    # Ẩn thông tin phiên bản Nginx
    server_tokens off;

    # Cấu hình SSL / TLS
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ========================================================
    # SECURITY HEADERS (BẢO VỆ ỨNG DỤNG WEB)
    # ========================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://images.unsplash.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;" always;

    # ========================================================
    # REVERSE PROXY CHUYỂN TIẾP ĐẾN BACKEND NODE.JS APP
    # ========================================================
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Truyền đầy đủ các HTTP Proxy Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================================
    # STATUS ENDPOINT CHO NGINX PROMETHEUS EXPORTER
    # ========================================================
    # Giới hạn chỉ cho phép mạng nội bộ Docker truy cập
    location /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Trang lỗi tùy chỉnh
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
